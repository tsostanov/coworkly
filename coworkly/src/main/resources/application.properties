spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coworkly?currentSchema=s367550}
spring.datasource.username=${DB_USER:coworkly}
spring.datasource.password=${DB_PASSWORD:coworkly}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=s367550
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:dGhpc0lzQWRlbW9uU3VwZXJTZWNyZXRLZXkzMjMyMTIzIQ==}
app.jwt.expiration-hours=48

spring.flyway.enabled=true
spring.flyway.default-schema=s367550
spring.flyway.schemas=s367550
spring.datasource.hikari.connection-init-sql=SET search_path TO s367550, public
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json
server.port=8081
